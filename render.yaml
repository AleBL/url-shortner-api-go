# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: url-shortener
    runtime: docker
    # Free instance: no persistent disk and an ephemeral filesystem, so the data
    # lives in an external PostgreSQL database (DATABASE_URL). It spins down after
    # 15 minutes without traffic and takes about a minute to wake up.
    plan: free
    region: virginia
    branch: master
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Deploy only after the GitHub Actions checks pass on master.
    autoDeployTrigger: checksPass
    envVars:
      # Asked for when the Blueprint is created. Never commit the real value.
      - key: DATABASE_URL
        sync: false
      # Frontend origins allowed by CORS, e.g. https://app.example.com
      - key: ALLOWED_ORIGINS
        sync: false
      # Header with the real client IP, used by the rate limit. Render sits behind
      # Cloudflare, which overwrites CF-Connecting-IP with the client address
      # (checked with GET /debug/client-ip, see README, Rate limiting).
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
